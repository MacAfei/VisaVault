<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <pattern id="schengen-bg" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="10" fill="none" stroke="#e0e7ff" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Visa Sticker -->
  <rect x="20" y="20" width="760" height="480" rx="12" fill="#fdfbf7" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="30" y="30" width="740" height="460" fill="url(#schengen-bg)"/>

  <!-- Header -->
  <text x="400" y="65" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e3a8a" letter-spacing="3">ETATS SCHENGEN / SCHENGEN STATES</text>
  <text x="400" y="85" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#64748b">VISA / VISA C</text>

  <!-- Photo Box -->
  <rect x="50" y="110" width="160" height="210" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="130" y="220" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#64748b">PHOTO</text>

  <!-- Details Table -->
  <text x="240" y="130" font-family="Arial, sans-serif" font-size="11" fill="#475569">VALABLE POUR / VALID FOR</text>
  <text x="240" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">ETATS SCHENGEN</text>

  <text x="500" y="130" font-family="Arial, sans-serif" font-size="11" fill="#475569">TYPE DE VISA / TYPE OF VISA</text>
  <text x="500" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">C (TOURISM)</text>

  <text x="240" y="180" font-family="Arial, sans-serif" font-size="11" fill="#475569">DU / FROM</text>
  <text x="240" y="200" font-family="Courier, monospace" font-size="15" font-weight="bold" fill="#0f172a">2026-01-15</text>

  <text x="370" y="180" font-family="Arial, sans-serif" font-size="11" fill="#475569">AU / UNTIL</text>
  <text x="370" y="200" font-family="Courier, monospace" font-size="15" font-weight="bold" fill="#0f172a">2026-07-15</text>

  <text x="500" y="180" font-family="Arial, sans-serif" font-size="11" fill="#475569">NOMBRE D'ENTREES / ENTRIES</text>
  <text x="500" y="200" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0f172a">MULT</text>

  <text x="640" y="180" font-family="Arial, sans-serif" font-size="11" fill="#475569">DUREE DE SEJOUR</text>
  <text x="640" y="200" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0f172a">90 DAYS</text>

  <text x="240" y="235" font-family="Arial, sans-serif" font-size="11" fill="#475569">PASSEPORT / PASSPORT NO</text>
  <text x="240" y="255" font-family="Courier, monospace" font-size="15" font-weight="bold" fill="#0f172a">A87654321</text>

  <text x="450" y="235" font-family="Arial, sans-serif" font-size="11" fill="#475569">NOM, PRENOM / SURNAME, NAME</text>
  <text x="450" y="255" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0f172a">SHARMA, ROHAN ARJUN</text>

  <text x="240" y="290" font-family="Arial, sans-serif" font-size="11" fill="#475569">DELIVRE A / ISSUED IN</text>
  <text x="240" y="310" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">PARIS / CONSULAT GENERAL</text>

  <text x="500" y="290" font-family="Arial, sans-serif" font-size="11" fill="#475569">LE / ON</text>
  <text x="500" y="310" font-family="Courier, monospace" font-size="14" font-weight="bold" fill="#0f172a">2026-01-10</text>

  <!-- Bottom MRZ -->
  <rect x="50" y="350" width="700" height="90" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="70" y="385" font-family="Courier, monospace" font-size="17" font-weight="bold" fill="#0f172a" letter-spacing="3">VCUTO&lt;&lt;SHARMA&lt;&lt;ROHAN&lt;ARJUN&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;</text>
  <text x="70" y="415" font-family="Courier, monospace" font-size="17" font-weight="bold" fill="#0f172a" letter-spacing="3">FR098765432UTO9208148M2607159C9034567891234&lt;00</text>

  <!-- Watermark -->
  <text x="400" y="270" font-family="Impact, sans-serif" font-size="80" text-anchor="middle" fill="#dc2626" opacity="0.15" transform="rotate(-20 400 270)">SPECIMEN / SAMPLE</text>
</svg>
