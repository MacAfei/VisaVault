<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <!-- White plain background conforming to ICAO 9303 -->
  <rect width="500" height="600" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
  <!-- Head & Shoulders -->
  <circle cx="250" cy="240" r="110" fill="#94a3b8"/>
  <ellipse cx="250" cy="520" rx="190" ry="170" fill="#475569"/>
  <!-- Guide overlay lines -->
  <line x1="250" y1="20" x2="250" y2="580" stroke="#0284c7" stroke-dasharray="6,6" stroke-width="1.5" opacity="0.4"/>
  <line x1="40" y1="240" x2="460" y2="240" stroke="#0284c7" stroke-dasharray="6,6" stroke-width="1.5" opacity="0.4"/>
  <text x="250" y="570" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#64748b">ICAO 35mm x 45mm SPECIFICATION</text>
  <text x="250" y="320" font-family="Impact, sans-serif" font-size="60" text-anchor="middle" fill="#dc2626" opacity="0.2" transform="rotate(-25 250 320)">SAMPLE PHOTO</text>
</svg>
